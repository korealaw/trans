name: Reconstruct app HTML

on:
  push:
    branches: [main]
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC3 v0.9.1 app files
        shell: bash
        run: |
          set -euo pipefail
          test -f .payload/READY
          : > app_payload.b64
          for i in $(seq -f "%03g" 0 28); do
            if test -f ".payload/xz.part${i}"; then
              head -c 12000 ".payload/xz.part${i}" >> app_payload.b64
            else
              test -f ".payload/xz.part${i}a"
              test -f ".payload/xz.part${i}b"
              head -c 6000 ".payload/xz.part${i}a" >> app_payload.b64
              head -c 6000 ".payload/xz.part${i}b" >> app_payload.b64
            fi
          done
          if test -f .payload/xz.part029; then
            head -c 10560 .payload/xz.part029 >> app_payload.b64
          else
            test -f .payload/xz.part029a
            test -f .payload/xz.part029b
            head -c 5280 .payload/xz.part029a >> app_payload.b64
            head -c 5280 .payload/xz.part029b >> app_payload.b64
          fi
          test "$(wc -c < app_payload.b64)" -eq 358560
          base64 -d app_payload.b64 > app_payload.tar.xz
          tar -xJf app_payload.tar.xz
          rm -f app_payload.b64 app_payload.tar.xz
          rm -rf .payload
          for f in 01_PHONE.html 02_PERSONAL_PC.html 03_INTRANET_PC.html; do
            test -s "$f"
          done
      - name: Commit reconstructed HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_PHONE.html 02_PERSONAL_PC.html 03_INTRANET_PC.html .payload || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy RC3 v0.9.1 app HTML [skip ci]"
          git push
