name: Apply Kakao OG metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-kakao-og.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply explicit OG metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 maintenance/apply_kakao_og_metadata.py
      - name: Commit OG metadata
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html 01_PHONE.html 02_PERSONAL_PC.html qa/static_results_kakao_og.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Kakao Open Graph metadata for 새마을금고 학습'
          git push origin HEAD:main
