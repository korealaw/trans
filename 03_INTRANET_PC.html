<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif}
button,input{font:inherit}button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--list-bg);position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
.hd{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd h1{font-size:19px;font-weight:850;margin:0;letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .back{width:34px;height:34px;margin-left:-6px;border:0;background:none;font-size:24px}.hd .right{margin-left:auto;font-size:12px;color:#5d5d5d;font-weight:850;border-radius:999px;background:#f4f4f4;padding:6px 10px;white-space:nowrap}.pg{height:3px;background:#e5e5e5}.pg i{display:block;height:100%;background:var(--kakao-yellow);transition:width .25s}
.body{min-height:calc(100vh - 61px);padding-bottom:76px}.chatbg{min-height:calc(100vh - 61px);background:var(--chat-bg);padding:16px 14px 34px}.session-note{margin:0 0 10px 36px;max-width:calc(100% - 40px);font-size:11.5px;line-height:1.55;color:#5e5e5e;background:rgba(248,248,248,.82);border:1px solid #d7d7d7;border-radius:3px;padding:8px 10px}.who{font-size:13px;color:#404040;margin:0 0 5px 49px;font-weight:750}.row{display:flex;margin-bottom:13px;align-items:flex-end;gap:9px}.row.me{justify-content:flex-end}.av{width:40px;height:40px;border-radius:14px;background:var(--kakao-brown);color:var(--kakao-yellow);flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}.bub{max-width:82%;background:var(--bubble-in);border-radius:4px 16px 16px 16px;padding:14px 15px;font-size:16.5px;line-height:1.72;letter-spacing:-.32px;box-shadow:0 1px 1px rgba(0,0,0,.05);word-break:keep-all}.row.me .bub{background:var(--bubble-out);border-radius:16px 4px 16px 16px}.tm{font-size:11px;color:#505050;padding-bottom:2px}.qmeta{font-size:12.5px;color:#616161;font-weight:850;margin-bottom:6px}.qmeta .dif{color:#535353;margin-left:6px}
.opts{margin:4px 0 0 49px;display:flex;flex-direction:column;gap:9px;max-width:86%}.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:#ffffff;border:1.5px solid #ffffff;border-radius:15px;padding:14px 15px;font-size:16.5px;line-height:1.62;letter-spacing:-.3px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:keep-all;min-height:64px}.opt .n{flex:0 0 28px;height:28px;border-radius:50%;background:#efefef;color:#636363;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:center}.opt.chosen{border-color:#6c6c6c;background:#fdfdfd}.opt.chosen .n{background:var(--kakao-yellow);color:var(--kakao-brown)}.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .n{background:var(--ok);color:white}.opt.no{border-color:var(--no);background:var(--no-bg)}.opt.no .n{background:var(--no);color:white}.opt[disabled]{cursor:default}.opt.dim{opacity:.5}
.exp{margin:8px 0 0 49px;max-width:90%;background:#ffffff;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px rgba(51,51,51,.12);border:1px solid rgba(0,0,0,.04);scroll-margin-top:70px}.vd{padding:14px 16px;border-bottom:1px solid var(--line)}.vd.o{background:var(--ok-bg)}.vd.x{background:var(--no-bg)}.vd b{font-size:17px}.vd .a{font-size:14px;color:#444444;margin-top:5px;line-height:1.6}.l1{padding:15px 16px;font-size:16px;line-height:1.78;word-break:keep-all}.l1 .tag{display:inline-block;font-size:12px;font-weight:900;color:#5b5b5b;background:var(--kakao-yellow);border-radius:6px;padding:4px 8px;margin-right:8px}.exp-section{border-top:1px solid var(--line);padding:14px 16px}.exp-section h4{margin:0 0 8px;font-size:15px}.exp-section p,.exp-section li{font-size:14px;line-height:1.75;margin:0;color:#373737}.exp-section ul{margin:0;padding-left:19px}.exp-section.blue{background:#f6f6f6;border-left:6px solid #a5a5a5}.exp-section.gold{background:#f6f6f6;border-left:6px solid #b8b8b8}.law{background:white;border:1px solid #dcdcdc;border-left:4px solid var(--kakao-yellow);border-radius:10px;padding:11px 12px;margin:9px 0;font-size:13.6px;line-height:1.72}.law .src{font-size:11.5px;font-weight:900;color:#6b6b6b;display:block;margin-bottom:5px}.law.decree{border-left-color:var(--blue)}.law.rule{border-left-color:var(--violet)}
.next-step{margin:12px 0 4px 49px;max-width:90%;background:rgba(255,255,255,.9);border-radius:15px;padding:12px}.next-step strong{display:block;font-size:14px;line-height:1.55;margin-bottom:9px}.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.memory-btn{border:0;border-radius:12px;min-height:56px;text-align:left;padding:9px 11px;font-weight:900}.memory-btn span{display:block}.memory-btn small{font-size:10.5px;font-weight:700;opacity:.8}.memory-btn.again{background:#eaeaea;color:#4b4b4b}.memory-btn.hard{background:#f1f1f1;color:#6d6d6d}.memory-btn.good{background:#f2f2f2;color:#595959}.memory-btn.easy{background:#eeeeee;color:#525252}
.profile{background:var(--kakao-yellow);padding:22px 20px 18px;display:flex;align-items:center;gap:15px}.pf-ico{width:58px;height:58px;border-radius:18px;background:var(--kakao-brown);color:var(--kakao-yellow);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:0 0 58px}.pf-t{font-size:19px;font-weight:850;color:var(--kakao-brown);letter-spacing:-.5px}.pf-s{font-size:13.5px;color:#5a5a5a;margin-top:4px;line-height:1.6}.hero{margin:16px 18px;border-radius:20px;padding:18px 16px;border:2px solid var(--kakao-yellow);background:#fcfcfc;box-shadow:0 7px 22px rgba(51,51,51,.12)}.hero .kicker{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:var(--kakao-brown);color:var(--kakao-yellow);margin-bottom:8px}.hero h2{font-size:21px;line-height:1.35;margin:0 0 8px}.hero p{font-size:13.6px;line-height:1.68;color:#545454;margin:0 0 12px}.hero-btn,.wide{display:block;width:100%;border:0;border-radius:14px;min-height:56px;padding:14px 12px;background:var(--kakao-yellow);color:var(--kakao-brown);font-size:16px;font-weight:900}.hero-sub{margin-top:9px;font-size:11.5px;color:#717171;line-height:1.55}.bar{padding:13px 20px 7px;font-size:13px;font-weight:800;color:#707070}.menu{list-style:none;margin:0;padding:0}.menu li{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:white}.mi{width:46px;height:46px;border-radius:15px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#f2f2f2}.mi.y{background:var(--kakao-yellow)}.mi.b{background:var(--kakao-brown);color:var(--kakao-yellow)}.mt{font-size:16.5px;font-weight:800}.ms{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.55}.badge{margin-left:auto;background:#eaeaea;color:#666666;font-size:12px;font-weight:800;border-radius:12px;padding:4px 8px}.badge.y{background:var(--kakao-yellow);color:var(--kakao-brown)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 18px}.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:white}.stat span{font-size:11.5px;color:#777777;display:block}.stat strong{display:block;margin-top:4px;font-size:20px;color:var(--kakao-brown)}.meter{height:9px;background:#eeeeee;border-radius:999px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--kakao-yellow)}
.card{margin:14px 18px;border:1px solid var(--line);border-radius:16px;padding:15px;background:#ffffff}.card h2,.card h3{margin:0 0 8px}.card p,.card li{font-size:13.5px;line-height:1.7;color:#535353}.card ul{padding-left:19px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#f2f2f2;font-size:11px;font-weight:850;color:#666666}.pill.y{background:#f5f5f5;color:#525252}.pill.g{background:#f4f4f4;color:#525252}.pill.r{background:#efefef;color:#434343}.source-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.source-chip{background:#f5f5f5;border:1px solid #e7e7e7;border-radius:999px;padding:5px 8px;font-size:10.5px;color:#555555}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.plan-btn{border:1px solid var(--line);background:#ffffff;border-radius:14px;padding:12px 11px;text-align:left;font-weight:850;color:var(--ink)}.plan-btn small{display:block;font-size:11.5px;color:#747474;margin-top:4px;font-weight:700}.plan-btn.active{border-color:#6c6c6c;background:#fdfdfd}.plan-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.plan-brief{font-size:12.5px;color:#707070;line-height:1.65;margin-top:7px}.plan-current{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f4f4f4;padding:6px 10px;font-size:12px;font-weight:850;color:#565656}.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.plan-actions .tool-btn,.plan-actions .wide,.tool-row .tool-btn{flex:1}.tool-row{display:flex;gap:8px;flex-wrap:wrap}
.map-row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.map-row:last-child{border-bottom:0}.map-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#f2f2f2}.map-dot.stable{background:#eeeeee;color:#525252}.map-dot.review{background:#f1f1f1;color:#6d6d6d}.map-dot.exposed{background:#f2f2f2;color:#595959}.map-dot.learning{background:#f5f5f5;color:#616161}.map-copy{flex:1}.map-copy b{font-size:14px}.map-copy small{display:block;color:#777777;margin-top:3px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(520px,100%);height:66px;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.98)}.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9f9f9f}.tab .ic{font-size:20px}.tab .lb{font-size:12px;font-weight:800}.tab.on{color:var(--kakao-brown)}
.mock-footer{margin:10px 0 0 36px;max-width:calc(100% - 40px);display:flex;gap:6px}.btn{flex:1;border:0;border-radius:3px;padding:9px 8px;font-size:12px;font-weight:700;min-height:36px}.b-y{background:var(--kakao-yellow);color:var(--kakao-brown)}.b-g{background:#f2f2f2;color:#333333}.b-dark{background:var(--kakao-brown);color:white}.res{padding:26px 20px 10px;text-align:center}.res .sc{font-size:46px;font-weight:900;color:var(--kakao-brown)}.res .sc small{font-size:19px;color:var(--sub)}.res .msg{font-size:14px;color:#555555;margin-top:8px;line-height:1.65}.diag{margin:14px 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.diag-row{display:flex;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}.diag-row:last-child{border-bottom:0}.diag-row strong{color:var(--kakao-brown)}
.tool-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.tool-btn{border:1px solid var(--line);background:#ffffff;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:800}.danger{color:#434343}.hidden{display:none!important}.toast{position:fixed;z-index:100;left:50%;bottom:86px;transform:translateX(-50%);width:min(410px,calc(100% - 28px));background:#252525;color:#ffffff;padding:13px 15px;border-radius:13px;font-size:14px;text-align:center;box-shadow:0 7px 26px rgba(0,0,0,.22)}
.desktop-side{display:none}.desktop-only{display:none}.mobile-only{display:block}

.main{position:absolute;left:13.18%;top:23.05%;width:57.25%;height:54.85%;display:flex;flex-direction:column;background:rgba(239,239,239,.80);border:1px solid rgba(181,181,181,.72);border-radius:1px;overflow:hidden;box-shadow:none}
.hd{height:31px;padding:0 10px;background:rgba(229,229,229,.82);border-bottom:1px solid #cccccc;position:relative;top:auto}.hd h1{font-size:12.5px;color:#484848;font-weight:700;letter-spacing:-.2px}.hd .back{width:24px;height:24px;margin-left:-1px;font-size:16px;color:#636363}.hd .right{padding:2px 7px;border-radius:2px;background:rgba(244,244,244,.92);border:1px solid #d2d2d2;color:#686868;font-size:10.5px;font-weight:700}

.body{flex:1;min-height:0;height:auto;padding-bottom:0;margin:0;overflow:auto;background:rgba(241,241,241,.70)}
.chatbg{min-height:100%;padding:10px 12px 14px;background:rgba(241,241,241,.56)}.session-note,.who,.opts,.exp,.next-step,.mock-footer{max-width:calc(100% - 44px)}.who{margin-left:36px;color:#5e5e5e;font-size:11px}.av{width:26px;height:26px;flex-basis:26px;border-radius:4px;background:#8f8f8f;color:#f5f5f5;font-size:11px}.row{gap:6px;margin-bottom:8px}.bub{max-width:calc(100% - 34px);background:rgba(250,250,250,.88);border:1px solid #d7d7d7;box-shadow:none;border-radius:3px;padding:8px 10px;font-size:12.2px;line-height:1.5}.qmeta{font-size:10px;color:#6f6f6f}.qmeta .dif{color:#7e7e7e}.opts{margin-left:36px;max-width:calc(100% - 40px);gap:6px}.opt{border-radius:3px;background:rgba(249,249,249,.9);border:1px solid #d5d5d5;box-shadow:none;padding:8px 9px;font-size:12.3px;line-height:1.42;min-height:40px}.opt .n{width:20px;height:20px;flex-basis:20px;border-radius:3px;background:#e6e6e6;color:#676767;font-size:10.5px}.opt.chosen{background:#f0f0f0;border-color:#a3a3a3}.opt.chosen .n{background:#9e9e9e;color:#ffffff}.opt.ok{background:#f1f1f1;border-color:#b3b3b3}.opt.no{background:#ededed;border-color:#acacac}
.exp{margin-left:36px;max-width:calc(100% - 32px);border-radius:3px;box-shadow:none;border:1px solid #d5d5d5}.exp-section{padding:8px 10px}.exp-section h4{font-size:11.5px}.exp-section p,.exp-section li,.l1{font-size:11.8px;line-height:1.55}.exp-section.blue{background:#f1f1f1;border-left:3px solid #afafaf}.exp-section.gold{background:#efefef;border-left:3px solid #ababab}.law{border-radius:2px;border-color:#dadada;border-left:3px solid #aaaaaa;background:#fcfcfc;padding:7px 8px;font-size:11.1px}.law .src{font-size:10px;color:#6d6d6d}
.next-step{margin-left:36px;max-width:calc(100% - 32px);background:#f6f6f6;border:1px solid #d6d6d6;border-radius:3px;padding:8px}.next-step strong{font-size:11.6px}.rating-grid{gap:6px}.memory-btn{min-height:40px;border-radius:3px;padding:7px 8px}.memory-btn span{font-size:11.8px}.memory-btn small{font-size:9.6px}.memory-btn.again{background:#e9e9e9;color:#565656}.memory-btn.hard{background:#e8e8e8;color:#616161}.memory-btn.good{background:#ececec;color:#565656}.memory-btn.easy{background:#ebebeb;color:#595959}

function allRemainingFocusIds(){const out=[];for(const d of DAILIES){const done=new Set(state.daily[d.id]?.done||[]);for(const qid of focusQuestionIds(d))if(!done.has(qid)&&!out.includes(qid))out.push(qid)}return out}
function currentPlan(d){
  const mode=state.settings?.mode||'count';
  const remaining=allRemainingFocusIds().length;
  const fallback=d?focusQuestionIds(d).length:FOCUS_TOTAL;
  const available=remaining>0?remaining:fallback;
  const requested=mode==='time'?Math.max(20,Math.round((state.settings.minutes||DEFAULT_FOCUS_MINUTES)/2)):(state.settings.count==='all'?available:Math.max(20,Number(state.settings.count)||DEFAULT_FOCUS_COUNT));

function conceptStatus(cid){
  const qs=QUESTIONS.filter(q=>q.concept===cid); if(!qs.length)return 'UNSEEN';
  const seen=qs.filter(q=>qstat(q.id).attempts>0); if(!seen.length)return 'UNSEEN';

  if(seen.some(q=>['again','hard'].includes(qstat(q.id).lastRating)))return 'REVIEW_DUE';

function weakQuestionIds(pool=QUESTIONS){
  return pool.filter(q=>{const s=qstat(q.id);return s.attempts>0&&((s.correct||0)<s.attempts||['again','hard'].includes(s.lastRating))})
    .sort((a,b)=>{const A=qstat(a.id),B=qstat(b.id);const aw=(['again','hard'].includes(A.lastRating)?20:0)+(A.attempts-A.correct)*5-A.correct;const bw=(['again','hard'].includes(B.lastRating)?20:0)+(B.attempts-B.correct)*5-B.correct;return bw-aw})

}

function buildQuickQueue(count=QUICK_REQUIRED_COUNT){
  const validIds=validQuickIds();
  const pool=validIds.map(id=>QUESTION_INDEX[id]);
  const target=Math.min(Math.max(1,Number(count)||QUICK_REQUIRED_COUNT),validIds.length);
  const weak=weakQuestionIds(pool);
  const unseen=validIds.filter(id=>qstat(id).attempts===0);
  const seen=pool.slice().sort((a,b)=>qstat(a.id).attempts-qstat(b.id).attempts).map(q=>q.id);
  const out=[];
  for(const id of weak.concat(unseen,seen)){if(out.indexOf(id)<0&&QUESTION_INDEX[id])out.push(id);if(out.length>=target)break}
  if(out.length<target){for(const id of validIds){if(out.indexOf(id)<0)out.push(id);if(out.length>=target)break}}
  return out.slice(0,target)
}

}

function normalizeState(s){
  const base=reviewDefaultState();
  const incomingDailySchema=s?.dailySchemaVersion;
  const incomingFlowSchema=s?.flowSchemaVersion;
  const next=Object.assign({},base,s||{});
  next.questionStats=next.questionStats||{};
  next.daily=next.daily||{};
  next.reviewBank=next.reviewBank||{};
  next.studyDate=next.studyDate||localDayKey();
  if(incomingDailySchema!==DAILY_SCHEMA_VERSION){
    const legacyDone=new Set(); Object.values(next.daily).forEach(ds=>(ds?.done||[]).forEach(id=>legacyDone.add(id)));
    const migrated={}; for(const d of DAILIES){const fids=focusQuestionIds(d);const done=fids.filter(id=>legacyDone.has(id));migrated[d.id]={done,completed:fids.length>0&&fids.every(id=>done.includes(id)),queue:[],index:0,sessionDone:false,answered:false,pick:null};}
    next.daily=migrated; next.dailySchemaVersion=DAILY_SCHEMA_VERSION; next.activeDaily=null;
  }

  if(next.focusRun&&typeof next.focusRun==='object'){
    next.focusRun.active=!!next.focusRun.active;
    next.focusRun.target=Math.max(20,Math.min(FOCUS_TOTAL,Number(next.focusRun.target)||DEFAULT_FOCUS_COUNT));
    next.focusRun.done=Math.max(0,Math.min(next.focusRun.target,Number(next.focusRun.done)||0));
  }else next.focusRun=null;
  next.settings=Object.assign({},DEFAULT_SETTINGS,next.settings||{});
  if(incomingFlowSchema!==FLOW_SCHEMA_VERSION){
    next.settings={...DEFAULT_SETTINGS};
    next.quick=null;next.mock=null;next.focusGate={...base.focusGate};next.focusRun=null;
    for(const ds of Object.values(next.daily||{})){if(ds){ds.answered=false;ds.pick=null;}}
    next.flowSchemaVersion=FLOW_SCHEMA_VERSION;
  }
  if(next.quick&&Array.isArray(next.quick.queue)){
    next.quick.queue=next.quick.queue.filter(id=>QUESTION_INDEX[id]);
    next.quick.recoveryIds=(next.quick.recoveryIds||[]).filter(id=>next.quick.queue.includes(id)&&QUESTION_INDEX[id]);
    if(!next.quick.queue.length)next.quick=null;
  }else next.quick=null;
  if(next.view==='quick'&&(!next.quick||!next.quick.queue||!next.quick.queue.length))next.view='learnHub';
  if(!['count','time'].includes(next.settings.mode))next.settings.mode='count';
  next.settings.count=next.settings.count==='all'?'all':Math.max(20,Math.min(80,Number(next.settings.count)||DEFAULT_SETTINGS.count));
  next.settings.minutes=Math.max(40,Math.min(160,Number(next.settings.minutes)||DEFAULT_SETTINGS.minutes));
  const validQ=new Set(QUESTIONS.map(q=>q.id));
  for(const d of DAILIES){
    const ds=next.daily[d.id]; if(!ds)continue;
    const focusIds=focusQuestionIds(d);
    ds.done=(ds.done||[]).filter(qid=>focusIds.includes(qid)&&validQ.has(qid));
    ds.completed=focusIds.length>0&&focusIds.every(qid=>ds.done.includes(qid));
    if(Array.isArray(ds.queue)){
      ds.queue=ds.queue.filter(x=>x&&validQ.has(x.qid)&&focusIds.includes(x.qid));
      if(Number(ds.index||0)>=ds.queue.length){ds.queue=[];ds.index=0;ds.sessionDone=true;ds.answered=false;ds.pick=null;}
    }
  }
  for(const [cid,e] of Object.entries(next.reviewBank)){
    if(!e||!QUESTIONS.some(q=>q.concept===cid)){delete next.reviewBank[cid];continue}
    e.status=e.status||'DUE';e.wrongCount=Number(e.wrongCount)||0;e.selfWeakCount=Number(e.selfWeakCount)||0;e.correctStreak=Number(e.correctStreak)||0;e.correctQids=(e.correctQids||[]).filter(id=>validQ.has(id));
    e.dueOn=e.dueOn||addLocalDays(localDayKey(),1);e.seenQids=(e.seenQids||[]).filter(id=>validQ.has(id));
  }
  return next;
}
function reviewEntries(){return Object.values(state.reviewBank||{}).filter(Boolean)}
function reviewOpenCount(){return reviewEntries().filter(e=>e.status!=='MASTERED').length}
function reviewMasteredCount(){return reviewEntries().filter(e=>e.status==='MASTERED').length}
function reviewDueEntries(){const t=localDayKey();return reviewEntries().filter(e=>e.status!=='MASTERED'&&(!e.dueOn||e.dueOn<=t)).sort((a,b)=>(b.wrongCount||0)-(a.wrongCount||0))}
function reviewDueCount(){return reviewDueEntries().length}
function reviewTomorrowCount(){const t=addLocalDays(localDayKey(),1);return reviewEntries().filter(e=>e.status!=='MASTERED'&&e.dueOn===t).length}
function ensureStudyDay(){const t=localDayKey();if(state.studyDate===t)return;state.studyDate=t;state.quick=null;state.focusGate={ready:false,pendingDailyId:null,completedAt:null};state.focusRun=null;if(['quick','dailyIntro','learn','dailyEnd','sessionEnd'].includes(state.view))state.view='home';save()}
function registerWrong(qid,source,pick){const q=questionById(qid);if(!q||!q.concept)return;const cid=q.concept;const old=state.reviewBank[cid]||{};state.reviewBank[cid]=Object.assign({},old,{concept:cid,category:q.category,seedQid:old.seedQid||qid,lastWrongQid:qid,lastPick:pick,source,wrongCount:(old.wrongCount||0)+1,correctStreak:0,correctQids:[],status:'DUE',dueOn:addLocalDays(localDayKey(),1),updatedAt:new Date().toISOString(),seenQids:Array.from(new Set([...(old.seenQids||[]),qid]))})}
function settleReview(qid){const q=questionById(qid);if(!q||!q.concept)return;const e=state.reviewBank[q.concept];if(!e)return;e.correctStreak=(e.correctStreak||0)+1;e.correctQids=Array.from(new Set([...(e.correctQids||[]),qid]));e.lastRightAt=localDayKey();e.updatedAt=new Date().toISOString();e.seenQids=Array.from(new Set([...(e.seenQids||[]),qid]));const variants=conceptQids(q.concept);const distinctConfirmed=e.correctQids.filter(id=>variants.includes(id)).length;if(e.correctStreak>=2&&distinctConfirmed>=2&&variants.length>=2){e.status='MASTERED';e.dueOn=addLocalDays(localDayKey(),7)}else{e.status='RECOVERING';e.dueOn=addLocalDays(localDayKey(),3)}state.reviewBank[q.concept]=e}
function conceptQids(cid){return QUESTIONS.filter(q=>q.concept===cid).map(q=>q.id)}
function reviewVariant(e,used){const ids=conceptQids(e.concept).filter(id=>QUESTION_INDEX[id]);const untried=ids.filter(id=>!used.has(id)&&id!==e.lastWrongQid&&id!==e.lastServedQid&&qstat(id).attempts===0);const alternate=ids.filter(id=>!used.has(id)&&id!==e.lastWrongQid&&id!==e.lastServedQid);const fallback=ids.filter(id=>!used.has(id)&&id!==e.lastServedQid);return untried[0]||alternate[0]||fallback[0]||e.lastWrongQid||ids[0]||null}
function buildQuickRecoveryQueue(count=QUICK_REQUIRED_COUNT){
  const used=new Set(),recovery=[],base=[];
  for(const e of reviewDueEntries().slice(0,6)){
    const id=reviewVariant(e,used);if(!id)continue;used.add(id);recovery.push(id);e.lastServedQid=id;e.lastServedAt=new Date().toISOString();
  }
  const valid=validQuickIds();const weak=weakQuestionIds(quickQuestions());const unseen=valid.filter(id=>qstat(id).attempts===0);const seen=valid.slice().sort((a,b)=>qstat(a).attempts-qstat(b).attempts);
  for(const id of weak.concat(unseen,seen,valid)){if(recovery.length+base.length>=count)break;if(!used.has(id)&&QUESTION_INDEX[id]){used.add(id);base.push(id)}}
  return {queue:recovery.concat(base).slice(0,count),recoveryIds:recovery};
}
function startQuick(force=false,targetDailyId=null){
  const target=DAILIES.some(d=>d.id===targetDailyId)?targetDailyId:(state.focusGate?.pendingDailyId||nextDaily()?.id||DAILIES[0]?.id||null);
  if(!force&&quickInProgress()){state.focusGate=Object.assign({},state.focusGate||{}, {ready:false,pendingDailyId:target});state.view='quick';save();render();return}
  const built=buildQuickRecoveryQueue(QUICK_REQUIRED_COUNT);
  state.focusGate={ready:false,pendingDailyId:target,completedAt:null};
  state.quick={queue:built.queue,recoveryIds:built.recoveryIds,index:0,answers:[],answered:false,pick:null,detail:'',done:false,startedAt:new Date().toISOString()};
  state.view=built.queue.length?'quick':'learnHub';save();render();if(!built.queue.length)toast('5분 문제 목록을 복구하지 못했습니다. 파일을 다시 열어주세요.')
}
function quickIsRecovery(qid){return !!state.quick?.recoveryIds?.includes(qid)}
function quickView(){
  if(!state.quick||!state.quick.queue?.length)return quickEmptyView();if(state.quick.done||state.quick.index>=state.quick.queue.length)return quickResultView();
  const s=state.quick,q=quickCurrent(),pick=s.pick,ok=s.answered&&pick===q.answer,pct=Math.round((s.index/s.queue.length)*100),recovery=quickIsRecovery(q.id),rc=(s.recoveryIds||[]).length;
  return shell(`${chrome('1단계 · 5분 문제',{back:true,progress:pct,right:`${s.index+1} / ${s.queue.length}`})}<div class="quick-page"><section class="learn-card sequence-note"><b>필수 선행 단계</b><p>${rc?`오늘 10문항 중 오답 회복 ${rc}문항을 먼저 섞었습니다. `:''}10문항을 모두 완료해야 2단계 집중학습이 열립니다.</p></section><div class="quick-bar"><i style="width:${pct}%"></i></div><section class="quick-card"><div class="quick-meta"><span class="quick-cat">${recovery?'오답 회복':'1단계 기본'} · ${esc(q.category)}</span><span class="quick-step">필수 ${s.index+1}/${s.queue.length}</span></div><div class="quick-q">${q.question}</div><div class="quick-opts">${q.options.map((o,i)=>`<button class="opt ${s.answered?(i===q.answer?'ok':i===pick?'no':'dim'):''}" data-quick-pick="${i}" ${s.answered?'disabled':''}><span class="n">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>${s.answered?`<div class="quick-feedback ${ok?'ok':'no'}"><b>${ok?'정답입니다':'오답입니다'} · ${q.answer+1}번 ${esc(q.options[q.answer])}</b><p>${recovery?'같은 문제 암기가 아니라 같은 개념 회복 여부를 확인하는 문항입니다. ':''}${esc(q.step1)}</p><div class="quick-detail-actions"><button data-quick-detail="why">왜 그런가요?</button><button data-quick-detail="source">공식 근거 보기</button></div>${quickDetailHtml(q,s.detail)}<button class="quick-next" data-quick-next>${s.index===s.queue.length-1?'1단계 완료하기':'다음 문제'}</button></div>`:''}</section></div>`,'learn')
}
function answerQuick(pick){const s=state.quick,q=quickCurrent();if(!s||!q||s.answered)return;s.answered=true;s.pick=pick;const st=qstat(q.id);st.attempts++;if(pick===q.answer){st.correct++;if(quickIsRecovery(q.id))settleReview(q.id)}else{st.lastRating='again';registerWrong(q.id,quickIsRecovery(q.id)?'review':'quick',pick)}st.lastPick=pick;state.questionStats[q.id]=st;s.answers.push({qid:q.id,pick,ok:pick===q.answer,recovery:quickIsRecovery(q.id)});save();render()}
function answerLearn(pick){const d=dailyById(state.activeDaily),s=state.daily[d.id],item=s.queue[s.index];if(s.answered)return;s.answered=true;s.pick=pick;const q=questionById(item.qid),st=qstat(item.qid);st.attempts++;if(pick===q.answer)st.correct++;else registerWrong(item.qid,'focus',pick);st.lastPick=pick;state.questionStats[item.qid]=st;save();render();requestAnimationFrame(()=>{const e=$('.exp');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})})}
function registerWeak(qid,source='self'){const q=questionById(qid);if(!q||!q.concept)return;const cid=q.concept;const old=state.reviewBank[cid]||{};state.reviewBank[cid]=Object.assign({},old,{concept:cid,category:q.category,seedQid:old.seedQid||qid,lastWeakQid:qid,source,wrongCount:old.wrongCount||0,selfWeakCount:(old.selfWeakCount||0)+1,correctStreak:0,correctQids:[],status:'DUE',dueOn:addLocalDays(localDayKey(),1),updatedAt:new Date().toISOString(),seenQids:Array.from(new Set([...(old.seenQids||[]),qid]))})}
function rateLearn(rate){
  const d=dailyById(state.activeDaily),s=state.daily[d.id],item=s.queue[s.index],q=questionById(item.qid),st=qstat(item.qid);st.lastRating=rate;state.questionStats[item.qid]=st;
  const wasCorrect=s.pick===q.answer;
  if(wasCorrect&&['good','easy'].includes(rate))settleReview(item.qid);
  if(wasCorrect&&['again','hard'].includes(rate))registerWeak(item.qid,'self');
  const firstCompletion=!item.isReview&&!(s.done||[]).includes(item.qid);if(firstCompletion){s.done=(s.done||[]).concat(item.qid);if(focusRunActive())state.focusRun.done=Math.min(state.focusRun.target,(state.focusRun.done||0)+1)}
  if(rate==='again')s.queue.splice(Math.min(s.index+3,s.queue.length),0,{qid:item.qid,isReview:true});if(rate==='hard')s.queue.splice(Math.min(s.index+6,s.queue.length),0,{qid:item.qid,isReview:true});
  s.index++;s.answered=false;s.pick=null;if(s.index>=s.queue.length){s.sessionDone=true;s.completed=focusQuestionIds(d).every(qid=>(s.done||[]).includes(qid));const goalReached=focusRunActive()&&(state.focusRun.done||0)>=(state.focusRun.target||DEFAULT_FOCUS_COUNT);if(goalReached){state.focusRun.active=false;state.focusRun.completedAt=new Date().toISOString()}if(s.completed){s.endCoverage=firstCoverage();state.view='dailyEnd'}else{state.view='sessionEnd'}}save();render()
}
function finalizeMockResults(){if(!state.mock||state.mock.reviewRecorded)return;MOCK.forEach((q,i)=>{const p=state.mock.answers[i];if(p===null||p===undefined)return;const st=qstat(q.id);st.attempts++;if(p===q.answer)st.correct++;else registerWrong(q.id,'mock',p);st.lastPick=p;state.questionStats[q.id]=st});state.mock.reviewRecorded=true}
function homeView(){
  const next=nextDaily(),done=DAILIES.filter(d=>state.daily[d.id]?.completed).length,gate=focusGateReady(),run=focusRunActive(),quickProg=quickInProgress(),plan=currentPlan(next),step1Done=gate||run,focusDone=state.focusRun?.done||0,focusTarget=state.focusRun?.target||plan.count;
  return shell(`${chrome('새마을금고 학습')}<div class="rc4-home"><div class="rc4-intro"><span class="rc4-kicker">TODAY</span><h2>오늘 학습은 1 → 2 순서입니다.</h2><p><b>5분 문제 10문항을 반드시 먼저 완료</b>한 뒤 집중학습으로 들어갑니다.${reviewDueCount()?` 오늘은 오답 회복 ${Math.min(6,reviewDueCount())}개념을 먼저 확인합니다.`:''}</p></div><div class="study-sequence"><section class="study-step ${step1Done?'done':'required'}"><div class="study-head"><span class="study-num">1</span><div><h3>5분 문제 · 필수</h3><p>핵심 10문항으로 기억을 꺼냅니다. 전날 오답이 있으면 같은 개념의 다른 문항을 우선 섞습니다.</p></div><span class="study-state">${step1Done?'완료':quickProg?'진행중':'필수'}</span></div>${step1Done?'<div class="study-complete">✓ 1단계 완료 · 집중학습 입장 가능</div>':`<button class="flow-btn" data-start-quick>${quickProg?'5분 문제 이어보기':'1단계 시작 · 10문항'}</button>`}</section><div class="flow-arrow">↓</div><section class="study-step ${run?'active':gate?'ready':'locked'}"><div class="study-head"><span class="study-num">2</span><div><h3>집중학습 · 기본 ${focusTarget}문항</h3><p>단계해설 · 보기별 판정 · 공식근거로 깊게 학습합니다.</p></div><span class="study-state">${run?`${focusDone}/${focusTarget}`:gate?'시작 가능':'잠김'}</span></div>${run||gate?`<button class="flow-btn strong" data-focus-daily="${next.id}">${run?'2단계 계속':'2단계 집중학습 시작'}</button>`:'<button class="flow-btn" disabled>1단계 완료 후 열림</button>'}</section></div><div class="rc4-secondary"><button class="mini-action" data-nav="mock"><b>실전 모의고사</b><small>20문항 · 제출 후 해설</small></button><button class="mini-action" data-nav="tools"><b>오답·학습기록</b><small>오답DB ${reviewOpenCount()} · 내일 예정 ${reviewTomorrowCount()}</small></button></div><div class="rc4-progress"><span>집중 Daily <b>${done}/${DAILIES.length}</b></span><span>기본 분량 <b>40문항</b></span></div></div>`,'home')
}
function toolsView(){const next=nextDaily(),plan=currentPlan(next),done=DAILIES.filter(d=>state.daily[d.id]?.completed).length,gate=focusGateReady(),run=focusRunActive();return shell(`${chrome('학습기록 · 도구')}<div class="learn-hub"><div class="rc4-intro"><span class="rc4-kicker">RECORD</span><h2>필요한 기록만 확인합니다.</h2><p>오답은 문제번호가 아니라 <b>취약 개념</b> 단위로 저장합니다.</p></div><div class="record-grid"><div class="record-box"><b>${studiedCount()}</b><span>학습문항 / ${QUESTIONS.length}</span></div><div class="record-box"><b>${reviewOpenCount()}</b><span>오답DB 개념</span></div><div class="record-box"><b>${reviewTomorrowCount()}</b><span>내일 회복 예정</span></div></div><section class="learn-card"><h3>오답 회복 방식</h3><p>틀린 개념은 다음날 5분 문제에 최대 6개념까지 우선 반영합니다. 같은 문제를 외우지 않도록 <b>같은 개념의 다른 문항을 우선 출제</b>하고, 대체 문항이 없을 때만 원문항을 재사용합니다.</p><div class="record-grid"><div class="record-box"><b>${reviewDueCount()}</b><span>오늘 회복 대상</span></div><div class="record-box"><b>${reviewMasteredCount()}</b><span>안정화 완료</span></div><div class="record-box"><b>2회</b><span>연속 확인 기준</span></div></div></section><section class="learn-card"><h3>다음 학습</h3><p>${run?'2단계 집중학습이 진행 중입니다.':gate?'1단계를 완료했습니다. 2단계 집중학습을 시작할 수 있습니다.':'1단계 5분 문제 10문항부터 시작해야 합니다.'}</p><div class="learn-actions">${run||gate?`<button class="strong" data-focus-daily="${next.id}">${run?'집중학습 계속':'2단계 시작'}</button>`:'<button class="strong" data-start-quick>1단계 5분 문제 시작</button>'}<button data-open-planner>분량 ${plan.count}문항</button></div></section><section class="learn-card"><h3>오프라인 학습기록</h3><p>같은 브라우저에서는 자동 저장합니다. 기기 이동이나 백업이 필요할 때만 JSON을 사용합니다.</p><div class="tool-row"><button class="tool-btn" data-export>내보내기</button><button class="tool-btn" data-import>가져오기</button><button class="tool-btn danger" data-reset>초기화</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"></section></div>`,'tools')}
function render(){ensureStudyDay();let html;switch(state.view){case'home':html=homeView();break;case'learnHub':html=learnHubView();break;case'quick':html=quickView();break;case'dailyIntro':html=dailyIntroView(state.activeDaily);break;case'learn':html=learnView();break;case'dailyEnd':html=dailyEndView();break;case'sessionEnd':html=sessionEndView();break;case'map':html=mapView();break;case'planner':html=plannerView();break;case'mock':html=mockView();break;case'tools':html=toolsView();break;default:html=homeView()}document.getElementById('app').innerHTML=html;bind()}

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(state.view==='quick'){const s=state.quick;if(s&&!s.answered&&['1','2','3','4'].includes(e.key))answerQuick(+e.key-1);else if(s?.answered&&e.key==='Enter'){e.preventDefault();nextQuick()}}else if(state.view==='learn'){const d=dailyById(state.activeDaily),s=state.daily[d.id];if(!s?.answered&&['1','2','3','4'].includes(e.key))answerLearn(+e.key-1)}else if(state.view==='mock'&&state.mock&&!state.mock.submitted){if(['1','2','3','4'].includes(e.key)){state.mock.answers[state.mock.index]=+e.key-1;save();render()}if(e.key==='Enter'&&state.mock.answers[state.mock.index]!==null){e.preventDefault();if(state.mock.index<MOCK.length-1)state.mock.index++;else{finalizeMockResults();state.mock.submitted=true;state.mock.reviewIndex=0}save();render()}}});
try{render()}catch(e){const a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:24px;font-family:Arial,sans-serif;color:#222;background:#eee;border:1px solid #999"><b>실행 점검 필요</b><br>브라우저가 로컬 HTML의 JavaScript 실행을 제한했거나 저장파일이 손상되었습니다.<br><small>'+esc(e&&e.message?e.message:String(e))+'</small></div>'}
